<!DOCTYPE html>
<html>
<head>
<title>To Do List</title>
   <link rel="stylesheet" href="to_do_list.css">
</head>
<body>
<section class="todo">

    <h2>Moje To-Do</h2>

    <input type="text" id="taskInput" placeholder="Napiš úkol...">

    <button onclick="addTask()">Přidat</button>

    <ul id="taskList"></ul>

</section>
   <script>

function addTask() {

    let input = document.getElementById("taskInput");
    let task = input.value;

    if (task === "") return;

    let li = document.createElement("li");
    li.textContent = task;

    li.onclick = function() {
        li.style.textDecoration = "line-through";
    };

    document.getElementById("taskList").appendChild(li);

    input.value = "";

}

</script>
</body>
</html>
