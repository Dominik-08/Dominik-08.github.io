<!DOCTYPE html>
<html>
<head>
<title>To Do List</title>
</head>

<body>

<h1>To Do List</h1>

<p>Toto je stránka o To Do Listu.</p>
<a href="index.html">Zpět na portfolio</a>
   <section class="todo">

    <h2>Mini aplikace – To Do List</h2>

    <input type="text" id="taskInput" placeholder="Napiš úkol...">

    <button onclick="addTask()">Přidat</button>

    <ul id="taskList"></ul>

</section>
   <script>

function addTask(){

    const input = document.getElementById("taskInput");
    const task = input.value;

    if(task === "") return;

    const li = document.createElement("li");
    li.textContent = task;

    const list = document.getElementById("taskList");
    list.appendChild(li);

    input.value = "";

}

</script>
</body>
</html>
